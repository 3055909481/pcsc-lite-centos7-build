name: Build pcsc-lite 2.0.3 (CentOS 7 x86_64)

on:
  workflow_dispatch:
    inputs:
      libudev:
        description: '启用 libudev（pcscd USB 热插拔）'
        type: boolean
        default: false
      polkit:
        description: '启用 polkit（pcscd 访问控制）'
        type: boolean
        default: false
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    name: Build on CentOS 7
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # checkout 放在宿主机：actions/* 基于 Node20，无法在 CentOS7 的 glibc 2.17 上运行
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside CentOS 7 container
        env:
          ENABLE_LIBUDEV: ${{ inputs.libudev == true && '1' || '0' }}
          ENABLE_POLKIT: ${{ inputs.polkit == true && '1' || '0' }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e ENABLE_LIBUDEV \
            -e ENABLE_POLKIT \
            -w /workspace \
            centos:7 \
            bash scripts/build.sh

      # 容器内以 root 写入，交还给 runner 用户以便后续步骤读取
      - name: Restore file ownership
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            "$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE"/pcsc-lite-*.tar.gz* || true

      - name: Verify artifacts
        run: |
          set -e
          test -f dist/lib/libpcsclite.a
          test -f dist/lib/libpcsclite.so
          test -f dist/include/PCSC/winscard.h
          file dist/lib/libpcsclite.*
          echo "--- BUILD_INFO ---"
          cat dist/BUILD_INFO
          echo "--- SHA256SUMS ---"
          cat dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcsc-lite-2.0.3-centos7-x86_64
          path: |
            dist/
            pcsc-lite-2.0.3-centos7-x86_64.tar.gz
            pcsc-lite-2.0.3-centos7-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pcsc-lite-2.0.3-centos7-x86_64.tar.gz
            pcsc-lite-2.0.3-centos7-x86_64.tar.gz.sha256
